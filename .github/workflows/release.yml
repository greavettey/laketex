name: Release & Publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (leave empty to use current commit)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release should run
        id: check
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            echo "Manual release dispatch for tag: $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Tag push detected: $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Release tag $TAG already exists on remote; skipping automated release on branch push."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            else
              echo "New version $VERSION detected in Cargo.toml without an existing tag! Proceeding with release for $TAG."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: laketex.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: laketex
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: laketex
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: laketex
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ needs.check-version.outputs.tag }}"
          $archiveDir = "laketex-${tag}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveDir
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $archiveDir/
          if (Test-Path "pdfium.dll") {
            Copy-Item "pdfium.dll" -Destination $archiveDir/
          }
          if (Test-Path "target/${{ matrix.target }}/release/pdfium.dll") {
            Copy-Item "target/${{ matrix.target }}/release/pdfium.dll" -Destination $archiveDir/
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination $archiveDir/
          }
          $zipName = "${archiveDir}.zip"
          Compress-Archive -Path "$archiveDir/*" -DestinationPath $zipName -Force
          Get-FileHash -Algorithm SHA256 $zipName | ForEach-Object { "$($_.Hash.ToLower())  $zipName" } | Out-File -FilePath "${zipName}.sha256" -Encoding ascii

      - name: Package Unix archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          ARCHIVE_DIR="laketex-${TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$ARCHIVE_DIR/"
          if [ "${{ runner.os }}" = "macOS" ] && [ -d "target/${{ matrix.target }}/release/LakeTeX.app" ]; then
            cp -R "target/${{ matrix.target }}/release/LakeTeX.app" "$ARCHIVE_DIR/LakeTeX.app"
            rm -f "$ARCHIVE_DIR/LakeTeX.app/Contents/MacOS/laketex"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$ARCHIVE_DIR/LakeTeX.app/Contents/MacOS/laketex"
            chmod +x "$ARCHIVE_DIR/LakeTeX.app/Contents/MacOS/laketex"
          fi
          [ -f "README.md" ] && cp "README.md" "$ARCHIVE_DIR/"
          TAR_NAME="${ARCHIVE_DIR}.tar.gz"
          tar -czf "$TAR_NAME" -C "$ARCHIVE_DIR" .
          shasum -a 256 "$TAR_NAME" > "${TAR_NAME}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            laketex-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [check-version, build-binaries]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Git tag exists
        shell: bash
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote."
          else
            echo "Tag $TAG does not exist. Creating and pushing tag..."
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Generate combined checksums file
        shell: bash
        run: |
          cd release-dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: LakeTeX ${{ needs.check-version.outputs.tag }}
          files: |
            release-dist/*
