name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (leave empty to use current commit)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: laketex.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: laketex
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: laketex
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: laketex
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine tag name
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package Windows archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $archiveDir = "laketex-${tag}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveDir
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $archiveDir/
          if (Test-Path "pdfium.dll") {
            Copy-Item "pdfium.dll" -Destination $archiveDir/
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination $archiveDir/
          }
          $zipName = "${archiveDir}.zip"
          Compress-Archive -Path "$archiveDir/*" -DestinationPath $zipName
          Get-FileHash -Algorithm SHA256 $zipName | ForEach-Object { "$($_.Hash.ToLower())  $zipName" } | Out-File -FilePath "${zipName}.sha256" -Encoding ascii

      - name: Package Unix archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ARCHIVE_DIR="laketex-${TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$ARCHIVE_DIR/"
          [ -f "README.md" ] && cp "README.md" "$ARCHIVE_DIR/"
          TAR_NAME="${ARCHIVE_DIR}.tar.gz"
          tar -czf "$TAR_NAME" -C "$ARCHIVE_DIR" .
          shasum -a 256 "$TAR_NAME" > "${TAR_NAME}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            laketex-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Generate combined checksums file
        shell: bash
        run: |
          cd release-dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: LakeTeX ${{ steps.vars.outputs.tag }}
          files: |
            release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
